# 毎晩22時(日本時間)にレース結果を照合し収支ダッシュボードを更新
# JST 22:00 = UTC 13:00
name: evening-checker

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: kyotei
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: 結果照合(レポート読込・出力ともに docs/)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y%m%d)
          python kyotei_result_checker.py --date "$TODAY" --report-dir docs --out docs

      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "evening results $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
